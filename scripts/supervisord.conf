[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:create_admin_user]
command=python3 /app/backend/create-admin-user.py
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/create_admin_user.log
stderr_logfile=/var/log/supervisor/create_admin_user_err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fastapi.log
stderr_logfile=/var/log/supervisor/fastapi_err.log
priority=20

[program:celery_worker]
command=celery -A app.celery_app worker --loglevel=info --pool=solo
directory=/app
autostart=true
autorestart=true
priority=30
environment=PYTHONPATH="/app"
stdout_logfile=/var/log/celery/worker.log
stderr_logfile=/var/log/celery/worker_err.log

[program:celery_beat]
command=celery -A app.celery_app beat --loglevel=info
directory=/app
autostart=true
autorestart=true
priority=40
environment=PYTHONPATH="/app"
stdout_logfile=/var/log/celery/beat.log
stderr_logfile=/var/log/celery/beat_err.log
